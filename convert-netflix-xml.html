<!DOCTYPE html>
<html>

<head>
    <style>
form {
    display: flex;
    flex-direction: column;
    align-items: start;
}

form > textarea {
    align-self: stretch;
}
    </style>
</head>

<body>
    <form>
        <textarea></textarea>
        <fieldset>
            <input type="radio" value="netflix" name="format" checked/><label for="netflix">Netflix</label>
            <input type="radio" value="iqiyi" name="format"/><label for="iqiyi">Iqiyi</label>
        </fieldset>
        <input type="submit" value="Convert" />
    </form>
    <h4>Converted Text:</h4>
    <pre></pre>

    <script>
function pad(n, ds = 2) {
    const s = n.toFixed(0);
    const zs = Array(ds - s.length).fill('0').join('');
    return zs.concat(s).substr(0, ds);
}

function convertNetflixTime(text) {
    const s = parseInt(text.substr(0, text.length - 1)) / 10_000_000;
    return convertTime(s);
}

function convertTime(s) {
    const millis = Math.floor( (s % 1) * 1000);
    const seconds = Math.floor(s % 60);
    const minutes = Math.floor(s % (60 * 60) / 60);
    const hours = Math.floor(s / 60 / 60);
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(millis, 3)}`;
}

function childText(node) {
    if(node.nodeType === document.TEXT_NODE)
        return [node.data];
    else if(node.nodeType === document.CDATA_SECTION_NODE)
        return [node.data];
    else if(node.nodeType === document.ELEMENT_NODE)
        return Array.from(node.childNodes).flatMap(childText)
    else
        return [];
}

function formattedChildText(node) {
    return childText(node)
        .map(s => s.trim())
        .filter(s => s !== '')
        .join(' - ');
}

function parseNetflix(parsed) {
    const ps = parsed.querySelectorAll('tt > body > div > p');

    return Array.from(ps)
        .map((p, idx) => {
            const begin = convertNetflixTime(p.getAttribute('begin'));
            const end = convertNetflixTime(p.getAttribute('end'));
            const text = formattedChildText(p);
            return `${idx + 1}\n${begin} --> ${end}\n${text}\n`;
        })
        .join('\n');
}

function parseIqiyi(parsed) {
    const es = parsed.querySelectorAll('xml > dia');

    return Array.from(es)
        .map((e, idx) => {
            const text = formattedChildText(e.querySelector('sub'));
            const begin = convertTime(parseInt(e.querySelector('st').textContent) / 1_000);
            const end = convertTime(parseInt(e.querySelector('et').textContent) / 1_000);
            return `${idx + 1}\n${begin} --> ${end}\n${text}\n`;
        })
        .join('\n');
}

function onSubmit(e) {
    e.preventDefault();

    const format = new FormData(document.querySelector('form')).get('format');
    const textArea = document.querySelector('textarea');
    const pre = document.querySelector('pre');

    const parser = new DOMParser();
    const parsed = parser.parseFromString(textArea.value, 'text/xml');

    let srtText;
    if (format === 'netflix') srtText = parseNetflix(parsed);
    else if(format === 'iqiyi') srtText = parseIqiyi(parsed);
    else throw new Error(`Unknown format: '${format}'`);

    pre.innerText = srtText;

    navigator.clipboard.writeText(srtText);
}

document.addEventListener('submit', onSubmit);
    </script>
</body>

</html>
