<!DOCTYPE html>
<html>

<head>
    <style>
form {
    display: flex;
    flex-direction: column;
    align-items: start;
}

form > textarea {
    align-self: stretch;
}
    </style>
</head>

<body>
    <form>
        <textarea></textarea>
        <input type="submit" value="Convert" />
    </form>
    <h4>Converted Text:</h4>
    <pre></pre>

    <script>
function pad(n, ds = 2) {
    const s = n.toFixed(0);
    const zs = Array(ds - s.length).fill('0').join('');
    return zs.concat(s).substr(0, ds);
}

function convertTime(text) {
    const s = parseInt(text.substr(0, text.length - 1)) / 10_000_000;
    const millis = Math.floor( (s % 1) * 1000);
    const seconds = Math.floor(s % 60);
    const minutes = Math.floor(s % (60 * 60) / 60);
    const hours = Math.floor(s / 60 / 60);
    return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}.${pad(millis, 3)}`;
}

function onSubmit(e) {
    e.preventDefault(); 

    const textArea = document.querySelector('textarea');
    const pre = document.querySelector('pre');

    const parser = new DOMParser();
    const parsed = parser.parseFromString(textArea.value, 'text/xml');

    const ps = parsed.querySelectorAll('tt > body > div > p');

    const srtText = Array.from(ps)
        .map((p, idx) => {
            const begin = convertTime(p.getAttribute('begin'));
            const end = convertTime(p.getAttribute('end'));
            const spans = Array.from(p.querySelectorAll('span'));
            const text = spans.map(span => span.childNodes[0].data).join(' - ');
            return `${idx + 1}\n${begin} --> ${end}\n${text}\n`;
        })
        .join('\n');

    pre.innerText = srtText;

    navigator.clipboard.writeText(srtText);
}

document.addEventListener('submit', onSubmit);
    </script>
</body>

</html>
